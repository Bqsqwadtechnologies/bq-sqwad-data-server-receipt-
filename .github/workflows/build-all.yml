name: Build Debug APK + Release APK + Release AAB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Set up Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "::error::Android SDK root is not configured on this runner"
            exit 1
          fi
          echo "Using Android SDK at $SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          # GitHub-hosted images install command-line tools but do not always
          # expose sdkmanager on PATH. Resolve it from the SDK installation.
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -path '*/bin/sdkmanager' -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type d -print | head -80 || true
            exit 1
          fi
          echo "Using sdkmanager at $SDKMANAGER"
          # The runner SDK directory can be mounted read-only; invoke the script
          # through bash instead of trying to change its file permissions.
          yes | bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          bash "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Decode keystore (for release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore.jks
            test -s keystore.jks
            echo "Keystore decoded successfully"
          else
            echo "No KEYSTORE_BASE64 secret — release will be unsigned"
          fi

      - name: Build Debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build Release APK + AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -s keystore.jks ]; then
            export KEYSTORE_PATH="$GITHUB_WORKSPACE/keystore.jks"
            echo "Building signed release artifacts"
          else
            unset KEYSTORE_PATH
            echo "::warning::No keystore configured; release artifacts will be unsigned"
          fi
          gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v6
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v6
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
